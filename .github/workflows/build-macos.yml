name: Build macOS app

# Roda sob demanda (botao "Run workflow" na aba Actions do GitHub) ou a cada
# push que muda algo no repo - builda pra Apple Silicon (macos-14), unico
# testado e confirmado funcionando ate agora. O job de Intel (macos-13) foi
# removido de proposito - nao testado/nao necessario no momento; se precisar
# de novo (alguem com Mac Intel), e' so' reativar o job com 'os: macos-13'.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (M1/M2/M3...)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Localizar o driver do Playwright
        id: driver
        run: |
          echo "path=$(python -c 'import playwright, os; print(os.path.join(os.path.dirname(playwright.__file__), "driver"))')" >> "$GITHUB_OUTPUT"

      - name: Gerar o app (PyInstaller)
        # sem '--icon' aqui de proposito - o icone hoje e' um .ico (formato
        # do Windows); o Mac espera .icns. Cosmetico, nao funcional - melhor
        # deixar sem por enquanto do que arriscar quebrar o build por causa
        # disso numa primeira rodada que ninguem testou ainda.
        #
        # '--add-data market:market' embute o CODIGO do market/ DENTRO do
        # proprio .app (extraido em tempo de execucao via sys._MEIPASS, ve
        # gui.py) - nao depende mais do usuario manter a pasta 'market' do
        # lado do .app (ex: arrastar so' o .app pra /Applications sem levar
        # 'market' junto - causa real ja vista de 'Painel de mercado
        # indisponivel'). Seguro copiar direto do checkout aqui porque o
        # git nunca tem os arquivos pessoais (market.db/backups/etc sao
        # gitignored) - ao contrario de uma build local, que precisa
        # filtrar antes.
        #
        # '--hidden-import sqlite3' - o PyInstaller so' bundla o que enxerga
        # sendo importado a partir de gui.py; como market/server.py e'
        # importado em runtime (fora da analise estatica), o 'import sqlite3'
        # dele passava batido e o app quebrava com "No module named
        # 'sqlite3'" ao tentar abrir o painel de mercado.
        run: |
          pyinstaller --onefile --windowed --name BaiakIdleBot \
            --add-data "${{ steps.driver.outputs.path }}:playwright/driver" \
            --add-data "market:market" \
            --hidden-import sqlite3 \
            gui.py

      - name: Copiar config padrao pro lado do app
        # 'make_share_zip.py' e' especifico de Windows (procura um .exe) - no
        # Mac o PyInstaller --windowed gera um pacote '.app' (uma pasta, nao
        # um arquivo unico), entao monta os defaults na mao aqui, direto da
        # mesma fonte (bot.DEFAULT_ROUTINES/DEFAULT_SETTINGS).
        run: |
          python -c "
          import json, bot
          json.dump(bot.DEFAULT_ROUTINES, open('dist/routines.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          json.dump(bot.DEFAULT_SETTINGS, open('dist/settings.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          "
          cp icon.ico dist/icon.ico

      - name: Copiar o codigo do market/ pro lado do app
        # so' o CODIGO (server.py, analyze.py etc) - nunca banco/backups/
        # perfil do Chrome/config pessoal (mesma lista de exclusao de
        # make_share_zip.py). Cada instalacao comeca com um banco vazio.
        run: |
          mkdir -p dist/market
          rsync -a --exclude 'market.db*' --exclude 'backups' --exclude 'chrome_profile' \
            --exclude 'config.json' --exclude '__pycache__' \
            --exclude 'handoff-baiak-market-alert.pdf' \
            market/ dist/market/

      - uses: actions/upload-artifact@v4
        with:
          name: BaiakIdleBot-macos-arm64
          path: dist/**
          if-no-files-found: error
